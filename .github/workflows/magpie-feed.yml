name: magpie-feed

# Keep the fnOS Magpie package on upstream's releases without building anything.
#
# The FPK sets MAGPIE_UPDATE_FEED to this repo's rolling release:
#   https://github.com/fisher423/FnDepot/releases/latest/download/update-feed.json
# so the feed published here is exactly what the NAS installs. It describes
# upstream's newest release with upstream's own numbers — the tag, the release
# notes, the asset URLs, and the per-file SHA-256 GitHub records for each
# asset — so the binary that lands on the box is byte-for-byte the one
# yetone/magpie shipped, and the box follows upstream like the desktop app.
#
# Read from the GitHub API rather than usemagpie.ai: that site drops requests
# from datacenter IPs, and the API's `digest` field already carries the same
# SHA-256 the official feed publishes.
#
# No FPK rebuild, no 70 MB upload: one small JSON, rewritten only when
# upstream releases something new.

on:
  schedule:
    - cron: "23 * * * *" # hourly; GitHub may start it a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magpie-feed
  cancel-in-progress: false

env:
  UPSTREAM_REPO: yetone/magpie
  FEED_TAG: magpie-feed
  STATE: .github/magpie-feed.version

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Describe upstream's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${UPSTREAM_REPO}/releases/latest" > /tmp/release.json
          python3 - <<'PY'
          import json, os, sys

          rel = json.load(open('/tmp/release.json', encoding='utf-8'))
          tag = str(rel.get('tag_name') or '').strip()
          version = tag[1:] if tag.startswith('v') else tag
          if not version:
              sys.exit('upstream release has no tag')

          # the only files a fnOS box ever picks: magpie's updater asks for
          # "magpie-cli-<goos>-<goarch>" and nothing else
          want = ('magpie-cli-linux-amd64', 'magpie-cli-linux-arm64')
          by_name = {a.get('name'): a for a in rel.get('assets') or []}
          assets = {}
          for n in want:
              a = by_name.get(n)
              if not a:
                  sys.exit('release %s has no %s' % (tag, n))
              digest = str(a.get('digest') or '')
              if not digest.startswith('sha256:') or len(digest) != 71:
                  # an asset without a recorded hash cannot be verified on
                  # the box, so refuse rather than publish a feed it rejects
                  sys.exit('%s has no sha256 digest (%r)' % (n, digest))
              assets[n] = {
                  'url': a['browser_download_url'],
                  'size': a['size'],
                  'sha256': digest[len('sha256:'):],
              }

          feed = {
              'version': version,
              'notes': (rel.get('body') or '').strip() or ('magpie %s' % version),
              'url': rel.get('html_url') or '',
              'assets': assets,
          }
          with open('update-feed.json', 'w', encoding='utf-8') as fh:
              json.dump(feed, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          print('upstream:', tag, '·', ', '.join('%s %s' % (n, assets[n]['sha256'][:12]) for n in want))
          PY

      - name: Publish the feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("update-feed.json"))["version"])')

          if ! gh release view "$FEED_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "no rolling release yet, creating $FEED_TAG"
            gh release create "$FEED_TAG" --repo "$REPO" --latest \
              --title "Magpie 更新源" \
              --notes "滚动发布：update-feed.json 每小时镜像 yetone/magpie 官方更新源，版本、说明、资产地址与 SHA-256 全部来自上游，不做二次构建。飞牛 fnOS 上的 Magpie 读这个文件自动更新。"
          fi

          rm -f /tmp/published.json
          gh release download "$FEED_TAG" --repo "$REPO" \
            --pattern update-feed.json --output /tmp/published.json --clobber 2>/dev/null || true

          if [ -f /tmp/published.json ] && cmp -s /tmp/published.json update-feed.json; then
            echo "already at $version, nothing to do"
            exit 0
          fi

          gh release upload "$FEED_TAG" --repo "$REPO" update-feed.json --clobber
          echo "published $version"

      # releases/latest/download/update-feed.json is the URL the FPK is built
      # with, so this release has to stay the repo's latest one. Re-asserted
      # every run, in case an FPK release was published in between.
      - name: Keep the feed release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release edit "$FEED_TAG" --repo "$REPO" --latest

      - name: Record the mirrored version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("update-feed.json"))["version"])')
          if [ -f "$STATE" ] && [ "$(tr -d '[:space:]' < "$STATE")" = "$version" ]; then
            echo "state already at $version"
            exit 0
          fi
          mkdir -p "$(dirname "$STATE")"
          printf '%s\n' "$version" > "$STATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE"
          git commit -m "chore(magpie-feed): 镜像上游 ${version}"
          git push
